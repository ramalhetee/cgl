<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Taverna</title>
<style>
  :root { --bg:#1b1613; --panel:#241d19; --raised:#30261f; --line:#3d3129; --text:#efe6dc; --muted:#a39384; --accent:#e0a43a; --danger:#d9624e; color-scheme: dark; font: 15px system-ui, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 28px; display: grid; gap: 18px; }
  h1 { font: 700 34px Georgia, serif; color: var(--accent); margin: 0; letter-spacing: .5px; }
  p { margin: 0; color: var(--muted); line-height: 1.45; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
  h2 { margin: 0; font-size: 17px; }
  button, input { font: inherit; color: inherit; border-radius: 9px; border: 1px solid var(--line); padding: 9px 14px; }
  button { background: var(--raised); cursor: pointer; transition: border-color .15s, transform .1s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #2a1c05; font-weight: 600; }
  input { background: var(--bg); width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .line { display: flex; gap: 8px; }
  .recents { display: flex; gap: 6px; flex-wrap: wrap; }
  .recents button { padding: 3px 12px; border-radius: 999px; font-size: 13px; }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; user-select: all; }
  #error { color: var(--danger); min-height: 20px; }
</style>
</head>
<body>
  <div>
    <h1>Taverna</h1>
    <p>Hospede sua própria mesa ou entre na de alguém.</p>
  </div>
  <div class="card">
    <h2>Hospedar neste PC</h2>
    <p>Seu computador vira o servidor. Enquanto o app estiver aberto, os outros entram pelo seu endereço.</p>
    <p id="addresses"></p>
    <button class="primary" id="host">Hospedar</button>
  </div>
  <div class="card">
    <h2>Entrar na mesa de alguém</h2>
    <form class="line" id="join">
      <input id="address" placeholder="Link ou endereço de quem hospeda" autofocus />
      <button class="primary" id="go">Entrar</button>
    </form>
    <div class="recents" id="recents"></div>
  </div>
  <p id="error"></p>
<script>
  const $ = (id) => document.getElementById(id)
  const busy = (on) => { $('host').disabled = $('go').disabled = on }
  const run = async (fn) => {
    $('error').textContent = ''
    busy(true)
    const r = await fn()
    if (r && r.error) { $('error').textContent = r.error; busy(false) }
  }
  $('host').onclick = () => run(() => window.taverna.host())
  $('join').onsubmit = (e) => { e.preventDefault(); run(() => window.taverna.connect($('address').value)) }
  window.taverna.state().then((s) => {
    if (!s) return
    $('host').textContent = s.hosting ? 'Abrir minha mesa' : 'Hospedar'
    const a = $('addresses')
    a.append('Seu endereço na rede: ')
    if (s.addresses.length === 0) a.append('nenhuma rede encontrada')
    s.addresses.forEach((addr, i) => {
      if (i) a.append(' ou ')
      const c = document.createElement('code'); c.textContent = addr; a.append(c)
    })
    for (const r of s.recents) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = r
      b.onclick = () => { $('address').value = r; run(() => window.taverna.connect(r)) }
      $('recents').append(b)
    }
  })
</script>
</body>
</html>
